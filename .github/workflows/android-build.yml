name: Android build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.zip'
      - '**.md'
  workflow_run:
    workflows: ["Unzip and organize"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'   # GitHub's minimum interval is 5 minutes
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found in expected locations"
            ls -R "$ANDROID_SDK_ROOT" || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ThisIsAButton-debug-apk
          path: app/build/outputs/apk/debug/*.apk
