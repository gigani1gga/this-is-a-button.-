name: Unzip and organize

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and organize
        run: |
          shopt -s nullglob
          found=0
          for z in *.zip; do
            found=1
            tmp=$(mktemp -d)
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            entries=("$tmp"/*)
            # If the zip wraps everything in one folder, flatten it
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmp"
            fi
            cp -a "$src"/. .
            git rm -q -f "$z"
          done
          echo "found=$found"

      - name: Commit organized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unzip and organize project files"
          git push
