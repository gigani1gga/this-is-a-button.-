name: Unzip and organize

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Zip in the repo root to unpack (leave empty to unpack every root .zip)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: unzip-organize
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN can never push changes to .github/workflows/.
          # If a PAT with the "workflow" scope is saved as the secret WORKFLOW_PAT,
          # it is used instead, and workflow files inside zips are kept.
          token: ${{ secrets.WORKFLOW_PAT || github.token }}

      - name: Unpack zip files into the repo
        id: unpack
        shell: bash
        env:
          ZIP_INPUT: ${{ github.event.inputs.zip_file }}
          HAS_WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ -n "$ZIP_INPUT" ]; then
            zips=("$ZIP_INPUT")
          else
            zips=(*.zip)
          fi

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found in the repo root. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Oldest first, so when several zips contain the same file the newest
          # zip is applied last and wins. "Newest" = most recently committed zip;
          # zips committed together are ordered by the newest file inside them.
          sorted=()
          while IFS=$'\t' read -r _ _ name; do
            sorted+=("$name")
          done < <(
            for z in "${zips[@]}"; do
              [ -f "$z" ] || continue
              ts=$(git log -1 --format=%ct -- "$z" 2>/dev/null || true)
              inner=$(python3 -c 'import sys,zipfile,datetime as d; print(int(max(d.datetime(*i.date_time).timestamp() for i in zipfile.ZipFile(sys.argv[1]).infolist())))' "$z" 2>/dev/null || echo 0)
              printf '%s\t%s\t%s\n' "${ts:-0}" "${inner:-0}" "$z"
            done | sort -t$'\t' -k1,1n -k2,2n -k3,3
          )
          [ ${#sorted[@]} -gt 0 ] && zips=("${sorted[@]}")

          replaced=0
          added=0

          for z in "${zips[@]}"; do
            if [ ! -f "$z" ]; then
              echo "::error::$z not found in the repo root"
              exit 1
            fi
            echo "Unpacking $z"
            tmp=$(mktemp -d)
            unzip -q -o "$z" -d "$tmp"

            # Drop macOS junk
            rm -rf "$tmp/__MACOSX"
            find "$tmp" -name ".DS_Store" -delete

            # If everything is wrapped in a single top-level folder, step into it
            src="$tmp"
            shopt -s dotglob
            entries=("$tmp"/*)
            shopt -u dotglob
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            fi

            # Never let a zip overwrite the workflow that is running it
            rm -f "$src/.github/workflows/unzip-organize.yml"

            # GITHUB_TOKEN is not allowed to push workflow files, so skip them
            # (unless a WORKFLOW_PAT secret is configured).
            if [ "$HAS_WORKFLOW_PAT" != "true" ] && [ -d "$src/.github/workflows" ]; then
              echo "  skipping .github/workflows from $z (no WORKFLOW_PAT secret set)"
              rm -rf "$src/.github/workflows"
            fi

            # Replace any file that already exists with the version from this zip
            while IFS= read -r -d '' f; do
              rel="${f#"$src"/}"
              if [ -e "$rel" ]; then
                replaced=$((replaced + 1))
                echo "  replaced: $rel"
              else
                added=$((added + 1))
              fi
            done < <(find "$src" -type f -print0)

            cp -a -f "$src"/. .
            rm -f "$z"
            rm -rf "$tmp"
          done

          echo "Done: $added new file(s), $replaced replaced with the newest version."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.unpack.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Unzip and organize uploaded files"

          # main may have moved while this job ran: rebase on top of it and retry.
          # -X theirs = on a conflict, keep the freshly unpacked files (newest wins).
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push after 5 attempts."
          exit 1
